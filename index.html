<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4f8a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>FrostRoute</title>
<style>
:root{--bg:#eef3f8;--card:#fff;--tx:#10212f;--mu:#62778a;--pr:#0b5fa5;--bd:#d6e0ea;--rd:#d63a3a;--or:#d9822b;--gr:#1a9a5b;--pk:#e0457b}
@media(prefers-color-scheme:dark){:root{--bg:#0b141d;--card:#142230;--tx:#e6eef6;--mu:#8da2b5;--bd:#25384a;--pr:#4aa3e8}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1{margin:0 0 4px;font-size:26px;letter-spacing:-.5px}h2{font-size:17px;margin:0}.mu{color:var(--mu);font-size:13px}.err{color:var(--rd);min-height:18px;font-size:13px}
.box{max-width:380px;margin:12vh auto 0;padding:0 20px}.wrap{max-width:720px;margin:0 auto;padding:12px}
input,select{width:100%;padding:12px;margin:5px 0;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.pin{text-align:center;font-size:30px;letter-spacing:12px}
.b{width:100%;padding:12px;margin:6px 0;border:0;border-radius:8px;background:var(--pr);color:#fff;font:600 15px system-ui;cursor:pointer}
.b.ghost{background:none;color:var(--pr);border:1px solid var(--bd)}.b.s{width:auto;padding:7px 12px;margin:3px 3px 0 0;font-size:13px}.b.red{background:var(--rd)}.b.grn{background:var(--gr)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--pr);color:#fff;position:sticky;top:0;z-index:5}
.top b{font-size:17px}.top small{opacity:.8;margin-left:4px}.top .sp{flex:1}.top button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:6px;padding:6px 10px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}.tabs .on{background:var(--pr);color:#fff;border-color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;color:#fff}.pending{background:var(--pk)}.approved{background:var(--gr)}.rejected,.disabled{background:var(--rd)}.admin{background:var(--pr)}
.perm{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}.perm input{width:20px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{padding:16px 10px;text-align:center;border-radius:10px;background:var(--card);border:1px solid var(--bd)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gr);display:inline-block}.dot.off{background:var(--or)}
.row{display:flex;gap:8px;align-items:center}details summary{cursor:pointer;color:var(--pr);padding:6px 0}
</style></head><body>
<div id="app"><div class="box"><p class="mu">Loading…</p></div></div>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="products.js"></script>
<script src="customers.js"></script>
<script>
document.title=APP.name;
function memberCust(){R(header()+'<div class=wrap id=cw></div>');syncDot();customersView($('#cw'),true)}
function memberProducts(){R(header()+'<div class=wrap id=pw></div>');syncDot();productsView($('#pw'),true)}
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const $=s=>document.querySelector(s),app=$('#app'),R=h=>app.innerHTML=h;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=async(p,u)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(u+':'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let U=null,ME=null,CFG={...DEFAULTS},unlocked=false,sig='',unsubs=[],hiddenAt=0,USERS=[],filter='pending',tab='users';
const K=()=>'pin_'+U.uid, ts=()=>Date.now();

/* ---------- sign in / sign up ---------- */
function loginView(mode='in',msg=''){
 R(`<div class="box"><h1>${esc(APP.name)}</h1><p class="mu">Sign in to continue · v${APP.version}</p>
 ${mode=='up'?'<input id=n placeholder="Full name">':''}<input id=e type=email placeholder="Email" autocomplete=email>
 <input id=p type=password placeholder="Password (min 6 characters)" autocomplete=current-password>
 <p class=err>${esc(msg)}</p><button class=b id=go>${mode=='in'?'Sign in':'Create account'}</button>
 <button class="b ghost" id=sw>${mode=='in'?'New member? Create account':'Have an account? Sign in'}</button></div>`);
 $('#sw').onclick=()=>loginView(mode=='in'?'up':'in');
 $('#go').onclick=async()=>{
  const e=$('#e').value.trim(),p=$('#p').value,n=mode=='up'?$('#n').value.trim():'';
  if(!e||p.length<6||(mode=='up'&&!n))return loginView(mode,'Enter all fields. Password needs 6+ characters.');
  try{
   if(mode=='in'){const c=await auth.signInWithEmailAndPassword(e,p);localStorage.setItem('login_'+c.user.uid,ts())}
   else{
    const c=await auth.createUserWithEmailAndPassword(e,p);localStorage.setItem('login_'+c.user.uid,ts());
    const first=!(await db.doc('meta/setup').get()).exists,b=db.batch();
    if(first)b.set(db.doc('meta/setup'),{admin:c.user.uid,at:ts()});
    b.set(db.doc('users/'+c.user.uid),{name:n,email:e,role:first?'admin':'member',status:first?'approved':'pending',branch:'',perms:{},createdAt:ts(),pinReset:0,forceLogoutAt:0});
    await b.commit();
   }
  }catch(x){loginView(mode,x.code=='auth/email-already-in-use'?'Email already registered. Sign in instead.':x.code=='auth/invalid-credential'?'Wrong email or password.':x.message)}
 }}

/* ---------- state routing ---------- */
auth.onAuthStateChanged(u=>{
 unsubs.forEach(f=>f());unsubs=[];U=u;ME=null;unlocked=false;sig='';
 if(!u)return loginView();
 unsubs.push(db.doc('users/'+u.uid).onSnapshot(s=>{ME=s.exists?s.data():null;route()},()=>{}));
 unsubs.push(db.doc('settings/app').onSnapshot(s=>{CFG={...DEFAULTS,...(s.data()||{})}},()=>{}));
});
function hasPin(){try{return JSON.parse(localStorage.getItem(K())).v===(ME.pinReset||0)}catch(e){return false}}
function route(){
 if(!U)return;
 if(!ME)return R('<div class="box"><p class="mu">Setting up your account…</p></div>');
 const lt=+localStorage.getItem('login_'+U.uid)||0;
 if((ME.forceLogoutAt||0)>lt||(CFG.passwordDays&&ts()-lt>CFG.passwordDays*864e5)){localStorage.removeItem(K());return auth.signOut()}
 const s=JSON.stringify([ME.status,ME.role,ME.pinReset,ME.perms,ME.branch,unlocked,hasPin()]);
 if(s===sig)return;sig=s;
 if(ME.status!='approved')return R(`<div class="box"><h1>${ME.status=='pending'?'Waiting for approval':'Access blocked'}</h1>
  <p class=mu>${ME.status=='pending'?'Your account is created. The admin must approve it before you can use the app.':'Your account is '+ME.status+'. Contact the admin.'}</p>
  <button class="b ghost" onclick="auth.signOut()">Sign out</button><p class=mu>v${APP.version}</p></div>`);
 if(!hasPin())return pinView(true);
 if(!unlocked)return pinView(false);
 ME.role=='admin'?adminView():memberView();
}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden)hiddenAt=ts();
 else if(U&&unlocked&&hiddenAt&&ts()-hiddenAt>CFG.pinLockSeconds*1000){unlocked=false;route()}
});

/* ---------- 6-digit PIN ---------- */
function pinView(setup){
 let first=null;const tk='tries_'+U.uid;
 R(`<div class=box><h1>${setup?'Create a 6-digit PIN':'Enter PIN'}</h1><p class=mu id=h>${setup?'This PIN unlocks the app on this phone.':'Hello '+esc(ME.name)}</p>
 <input id=pin class=pin type=password inputmode=numeric maxlength=6 autocomplete=off><p class=err id=pe></p>
 ${setup?'':'<button class="b ghost" id=fg>Forgot PIN? Sign in again</button>'}</div>`);
 const i=$('#pin');i.focus();
 i.oninput=async()=>{
  if(i.value.length<6)return;const v=i.value;i.value='';
  if(setup){
   if(!first){first=v;$('#h').textContent='Type the PIN again to confirm';return}
   if(first!==v){first=null;$('#h').textContent='Choose a 6-digit PIN';return $('#pe').textContent='PINs did not match. Start again.'}
   localStorage.setItem(K(),JSON.stringify({h:await hash(v,U.uid),v:ME.pinReset||0}));unlocked=true;sig='';route();
  }else{
   if(await hash(v,U.uid)===JSON.parse(localStorage.getItem(K())).h){localStorage.removeItem(tk);unlocked=true;sig='';route()}
   else{const t=(+localStorage.getItem(tk)||0)+1;localStorage.setItem(tk,t);
    if(t>=5){localStorage.removeItem(tk);localStorage.removeItem(K());return auth.signOut()}
    $('#pe').textContent='Wrong PIN. '+(5-t)+' tries left.'}
  }};
 if($('#fg'))$('#fg').onclick=()=>{localStorage.removeItem(K());auth.signOut()};
}

/* ---------- shared header ---------- */
function header(){return `<div class=top><b>${esc(APP.name)}</b><small>v${APP.version}</small><span class=sp></span>
 <span id=sy class=mu style="color:#fff"></span><button onclick="unlocked=false;sig='';route()">Lock</button><button onclick="auth.signOut()">Sign out</button></div>`}
function syncDot(){const e=$('#sy');if(e)e.innerHTML=`<span class="dot ${navigator.onLine?'':'off'}"></span> ${navigator.onLine?'Online':'Offline'}`}
addEventListener('online',syncDot);addEventListener('offline',syncDot);

/* ---------- member home ---------- */
function memberView(){
 const on=Object.keys(PERMS).filter(k=>ME.perms&&ME.perms[k]);
 R(header()+`<div class=wrap><h2>Hello ${esc(ME.name)}</h2><p class=mu>Branch: ${esc(ME.branch||'not set')}</p>
 ${on.length?`<div class=grid>${on.map(k=>k=='viewProducts'?`<div class=tile onclick="memberProducts()" style="cursor:pointer;border-color:var(--pr)"><b>Products</b><div class=mu>Search, scan, prices</div></div>`:k=='manageCustomers'?`<div class=tile onclick="memberCust()" style="cursor:pointer;border-color:var(--pr)"><b>Customers</b><div class=mu>Today's visits, search, reminders</div></div>`:k=='visitPlan'?'':`<div class=tile>${PERMS[k]}<div class=mu>Coming in a later phase</div></div>`).join('')}</div>`
 :'<div class=card>No features are switched on for you yet. Ask the admin to give access.</div>'}</div>`);
 syncDot();
}

/* ---------- admin panel ---------- */
function adminView(){
 R(header()+`<div class=wrap><div class=tabs><button id=t1>Users</button><button id=t3>Products</button><button id=t4>Customers</button><button id=t2>Settings</button></div><div id=tb></div></div>`);
 syncDot();$('#t1').onclick=()=>{tab='users';adminView()};$('#t2').onclick=()=>{tab='set';adminView()};$('#t3').onclick=()=>{tab='prod';adminView()};$('#t4').onclick=()=>{tab='cust';adminView()};
 $('#t'+({users:1,set:2,prod:3,cust:4}[tab])).className='on';
 if(tab=='users'){
  $('#tb').innerHTML=`<select id=f>${['pending','approved','rejected','disabled','all'].map(x=>`<option ${x==filter?'selected':''} value=${x}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select><div id=ul></div>`;
  $('#f').onchange=e=>{filter=e.target.value;drawUsers()};
  unsubs.push(db.collection('users').orderBy('createdAt','desc').onSnapshot(s=>{USERS=s.docs.map(d=>({id:d.id,...d.data()}));drawUsers()}));
 }else if(tab=='prod')productsView($('#tb'));else if(tab=='cust')customersView($('#tb'));else settingsView();
}
function drawUsers(){
 const ul=$('#ul');if(!ul)return;
 const L=USERS.filter(u=>filter=='all'||u.status==filter);
 ul.innerHTML=L.length?L.map(u=>{const me=u.id==U.uid;return `<div class=card>
  <div class=row><h2 style="flex:1">${esc(u.name)}</h2><span class="tag ${u.status}">${u.status}</span>${u.role=='admin'?'<span class="tag admin">admin</span>':''}</div>
  <div class=mu>${esc(u.email)}</div>
  <input placeholder="Branch (e.g. Riyadh, Jeddah)" value="${esc(u.branch)}" data-id=${u.id} data-act=branch>
  ${me?'':`<div>${u.status!='approved'?`<button class="b s grn" data-id=${u.id} data-act=approved>Approve</button>`:''}
  ${u.status=='pending'?`<button class="b s red" data-id=${u.id} data-act=rejected>Reject</button>`:''}
  ${u.status=='approved'?`<button class="b s red" data-id=${u.id} data-act=disabled>Disable</button>`:''}
  <button class="b s ghost" data-id=${u.id} data-act=pin>Reset PIN</button><button class="b s ghost" data-id=${u.id} data-act=logout>Force logout</button>
  <button class="b s ghost" data-id=${u.id} data-act=role>${u.role=='admin'?'Make member':'Make admin'}</button></div>
  <details><summary>Permissions (all off by default)</summary>${Object.entries(PERMS).map(([k,l])=>`<label class=perm><input type=checkbox data-id=${u.id} data-act=perm data-k=${k} ${u.perms&&u.perms[k]?'checked':''}>${l}</label>`).join('')}</details>`}</div>`}).join('')
  :'<div class=card>No users here.</div>';
}
document.addEventListener('click',async e=>{
 const a=e.target.dataset&&e.target.dataset.act,id=e.target.dataset&&e.target.dataset.id;if(!a||!id||a=='perm'||a=='branch')return;
 const r=db.doc('users/'+id);
 if(a=='approved'||a=='rejected'||a=='disabled')await r.update({status:a});
 if(a=='pin'&&confirm('Reset this member PIN? They must set a new one.'))await r.update({pinReset:ts()});
 if(a=='logout'&&confirm('Force this member to sign in again?'))await r.update({forceLogoutAt:ts()});
 if(a=='role'&&confirm('Change role?')){const u=USERS.find(x=>x.id==id);await r.update({role:u.role=='admin'?'member':'admin'})}
});
document.addEventListener('change',async e=>{
 const d=e.target.dataset;if(!d||!d.id)return;
 if(d.act=='perm')await db.doc('users/'+d.id).update({['perms.'+d.k]:e.target.checked});
 if(d.act=='branch')await db.doc('users/'+d.id).update({branch:e.target.value.trim()});
});
function settingsView(){
 $('#tb').innerHTML=`<div class=card><h2>Settings (admin only)</h2>${Object.entries(SETTING_LABELS).map(([k,l])=>`<label class=mu>${l}</label><input type=number id=s_${k} value="${CFG[k]}">`).join('')}
 <button class=b id=sv>Save settings</button><p class=mu id=sm></p></div>
 <div class=card><h2>About</h2><p class=mu>${esc(APP.name)} · version ${APP.version} · ${APP.date}</p></div>`;
 $('#sv').onclick=async()=>{const o={};for(const k in SETTING_LABELS)o[k]=+$('#s_'+k).value;await db.doc('settings/app').set(o,{merge:true});$('#sm').textContent='Saved.'};
}

/* ---------- service worker + auto reload on new version ---------- */
if('serviceWorker' in navigator){
 const had=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.register('sw.js');
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload()});
}
</script></body></html>
