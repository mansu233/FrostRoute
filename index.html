<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a4592"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>FrostRoute</title>
<style>
:root{--bg:#f2f5f9;--card:#fff;--tx:#0e1d2b;--mu:#5b6f82;--pr:#0a5bb5;--bd:#dbe4ed;--rd:#d3392f;--or:#d97b1d;--gr:#169a5a;--pk:#d9437a;--sh:0 1px 2px rgba(15,40,70,.06),0 4px 14px rgba(15,40,70,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#09121b;--card:#111e2c;--tx:#e8eff6;--mu:#8aa0b4;--bd:#223448;--pr:#4da3f0;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
h1{margin:0 0 6px;font-size:30px;font-weight:800;letter-spacing:-.8px}h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.2px}.mu{color:var(--mu);font-size:13.5px}.err{color:var(--rd);min-height:18px;font-size:14px}
.box{max-width:400px;margin:11vh auto 0;padding:0 22px}.wrap{max-width:720px;margin:0 auto;padding:14px}
input,select,textarea{width:100%;min-height:48px;padding:12px 14px;margin:5px 0;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(10,91,181,.15)}input[type=checkbox]{min-height:0;width:22px;height:22px;accent-color:var(--pr)}
.pin{text-align:center;font-size:32px;letter-spacing:14px;min-height:64px}
.b{display:block;width:100%;min-height:48px;padding:12px;margin:8px 0;border:0;border-radius:12px;background:var(--pr);color:#fff;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;transition:transform .08s}
.b:active{transform:scale(.97)}.b.ghost{background:transparent;color:var(--pr);border:1.5px solid var(--bd)}.b.s{display:inline-block;width:auto;min-height:40px;padding:8px 14px;margin:4px 4px 0 0;font-size:14px;border-radius:10px}.b.red{background:var(--rd);color:#fff}.b.grn{background:var(--gr);color:#fff}.b[disabled]{opacity:.5}
.top{display:flex;align-items:center;gap:6px;padding:11px 14px;background:linear-gradient(135deg,#0a4592,#1479d6);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(10,60,120,.3)}
.top b{font-size:19px;font-weight:800;letter-spacing:-.4px}.top small{opacity:.75;font-size:12px}.top .sp{flex:1}.top button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:9px;padding:8px 11px;font-family:inherit;font-weight:600;font-size:13px;min-height:36px}
#sy{font-size:12.5px;color:#fff}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(15,40,70,.08)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;border:0;background:none;color:var(--mu);font-family:inherit;font-weight:600;font-size:11px;position:relative;min-height:58px}
#nav button.on{color:var(--pr)}#nav button.on:before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 4px 4px;background:var(--pr)}
.tabs{display:flex;gap:8px;margin:10px 0;overflow-x:auto;scrollbar-width:none}.atabs{display:none}
.tabs button{flex:1 0 auto;min-height:42px;padding:9px 16px;border:1.5px solid var(--bd);border-radius:99px;background:var(--card);color:var(--tx);font-family:inherit;font-weight:600;font-size:14px}.tabs .on{background:var(--pr);color:#fff;border-color:var(--pr)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--sh)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;letter-spacing:.2px}.pending{background:var(--pk)}.approved{background:var(--gr)}.rejected,.disabled{background:var(--rd)}.admin{background:var(--pr)}
.perm{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px}.perm input{margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{padding:18px 14px;border-radius:16px;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--pr);box-shadow:var(--sh);min-height:92px;font-size:16px}
.tile b{font-size:17px}.dot{width:9px;height:9px;border-radius:50%;background:#4be08f;display:inline-block}.dot.off{background:#ffb454}
.row{display:flex;gap:8px;align-items:center}details summary{cursor:pointer;color:var(--pr);padding:10px 0;font-weight:600}hr{border:0;border-top:1px solid var(--bd);margin:10px 0}
@media print{body>*:not(#ov){display:none!important}#ov{position:static!important;overflow:visible!important;padding:0!important}.noprint{display:none!important}body{padding:0!important;background:#fff!important}}
button,input,select,label,.card{touch-action:manipulation}
#osd,#smk,#rsv{position:sticky;bottom:10px;box-shadow:0 8px 22px rgba(10,91,181,.35)}
</style></head><body>
<div id="app"><div class="box"><p class="mu">Loading…</p></div></div>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="products.js"></script>
<script src="customers.js"></script>
<script src="orders.js"></script>
<script src="cash.js"></script>
<script src="extras.js"></script>
<script src="admin.js"></script>
<script src="plan.js"></script>
<script>
document.title=APP.name;
function memberOrders(){NAVK='ord';R(header()+'<div class=wrap id=ww></div>');syncDot();ordersHome($('#ww'),true)}
function memberClose(){NAVK='cash';R(header()+'<div class=wrap id=xw></div>');syncDot();closingView($('#xw'),true)}
function memberLoad(){NAVK='load';R(header()+'<div class=wrap id=xw></div>');syncDot();loadListView($('#xw'),true)}
function memberRank(){CV.tab='rank';memberCust();NAVK='rank';$('#nav')&&$('#nav').querySelectorAll('button').forEach(b=>b.className=b.dataset.nav=='rank'?'on':'')}
function memberReports(){NAVK='rep';R(header()+'<div class=wrap id=xw></div>');syncDot();myReport($('#xw'),true)}
function memberPlan(){NAVK='plan';R(header()+'<div class=wrap id=pln></div>');syncDot();planView($('#pln'))}
function memberCust(){NAVK='cust';R(header()+'<div class=wrap id=cw></div>');syncDot();customersView($('#cw'),true)}
function memberProducts(){NAVK='prod';R(header()+'<div class=wrap id=pw></div>');syncDot();productsView($('#pw'),true)}
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
db.settings({experimentalAutoDetectLongPolling:true});
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const $=s=>document.querySelector(s),app=$('#app'),R=h=>app.innerHTML=h;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=async(p,u)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(u+':'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let U=null,ME=null,CFG={...DEFAULTS},unlocked=false,sig='',unsubs=[],hiddenAt=0,USERS=[],filter='pending',tab='home';
const K=()=>'pin_'+U.uid, ts=()=>Date.now();

/* ---------- sign in / sign up ---------- */
function loginView(mode='in',msg=''){
 R(`<div class="box"><h1>${esc(APP.name)}</h1><p class="mu">Sign in to continue · v${APP.version}</p>
 ${mode=='up'?'<input id=n placeholder="Full name">':''}<input id=e type=email placeholder="Email" autocomplete=email>
 <input id=p type=password placeholder="Password (min 6 characters)" autocomplete=current-password>
 <p class=err>${esc(msg)}</p><button class=b id=go>${mode=='in'?'Sign in':'Create account'}</button>
 <button class="b ghost" id=sw>${mode=='in'?'New member? Create account':'Have an account? Sign in'}</button></div>`);
 $('#sw').onclick=()=>loginView(mode=='in'?'up':'in');
 $('#go').onclick=async()=>{
  const e=$('#e').value.trim(),p=$('#p').value,n=mode=='up'?$('#n').value.trim():'';
  if(!e||p.length<6||(mode=='up'&&!n))return loginView(mode,'Enter all fields. Password needs 6+ characters.');
  try{
   if(mode=='in'){const c=await auth.signInWithEmailAndPassword(e,p);localStorage.setItem('login_'+c.user.uid,ts())}
   else{
    const c=await auth.createUserWithEmailAndPassword(e,p);localStorage.setItem('login_'+c.user.uid,ts());
    const first=!(await db.doc('meta/setup').get()).exists,b=db.batch();
    if(first)b.set(db.doc('meta/setup'),{admin:c.user.uid,at:ts()});
    b.set(db.doc('users/'+c.user.uid),{name:n,email:e,role:first?'admin':'member',status:first?'approved':'pending',branch:'',perms:{},createdAt:ts(),pinReset:0,forceLogoutAt:0});
    await b.commit();
   }
  }catch(x){loginView(mode,x.code=='auth/email-already-in-use'?'Email already registered. Sign in instead.':x.code=='auth/invalid-credential'?'Wrong email or password.':x.message)}
 }}

/* ---------- state routing ---------- */
auth.onAuthStateChanged(u=>{
 unsubs.forEach(f=>f());unsubs=[];U=u;ME=null;unlocked=false;sig='';
 if(!u)return loginView();
 unsubs.push(db.doc('users/'+u.uid).onSnapshot(s=>{
  if(!s.exists){if(s.metadata.fromCache)return;ME=null;return problemView('Account record not found','Sign-in worked, but the app cannot find your account record in the database. Check Firestore, users collection, for a document with the account ID below.')}
  ME=s.data();route()},e=>problemView('Cannot load your account','Reason: '+esc(e.code||e.message)+'. Check the internet connection and that the Firestore rules are published.')));
 setTimeout(()=>{if(U&&U.uid==u.uid&&!ME)problemView('Still loading','The app could not load your account within 10 seconds. Check the internet connection (airplane mode off), then try again.')},10000);
 unsubs.push(db.doc('settings/app').onSnapshot(s=>{CFG={...DEFAULTS,...(s.data()||{})};window.annDraw&&annDraw();applyFont()},()=>{}));
});
function problemView(t,m){R(`<div class=box><h1>${t}</h1><p class=mu>${m}</p><p class=mu>Account ID:<br><b style="word-break:break-all;color:var(--tx)">${U?U.uid:''}</b><br>${U?esc(U.email):''}</p><button class=b onclick="location.reload()">Try again</button><button class="b ghost" onclick="auth.signOut()">Sign out</button><button class="b ghost" onclick="resetLocal()">Reset saved data on this phone</button></div>`)}
async function resetLocal(){if(!confirm('This clears the saved copy of data on this phone and downloads it again. Anything not yet synced is lost. Continue?'))return;try{await db.terminate();await db.clearPersistence()}catch(e){}location.reload()}
function hasPin(){try{return JSON.parse(localStorage.getItem(K())).v===(ME.pinReset||0)}catch(e){return false}}
function route(){
 if(!U)return;
 if(!ME)return R('<div class="box"><p class="mu">Setting up your account…</p></div>');
 applyFont();const lt=+localStorage.getItem('login_'+U.uid)||0;
 if((ME.forceLogoutAt||0)>lt||(CFG.passwordDays&&ts()-lt>CFG.passwordDays*864e5)){localStorage.removeItem(K());return auth.signOut()}
 const s=JSON.stringify([ME.status,ME.role,ME.pinReset,ME.perms,ME.branch,unlocked,hasPin()]);
 if(s===sig)return;sig=s;
 if(ME.status!='approved')return R(`<div class="box"><h1>${ME.status=='pending'?'Waiting for approval':'Access blocked'}</h1>
  <p class=mu>${ME.status=='pending'?'Your account is created. The admin must approve it before you can use the app.':'Your account is '+ME.status+'. Contact the admin.'}</p>
  <button class="b ghost" onclick="auth.signOut()">Sign out</button><p class=mu>v${APP.version}</p></div>`);
 if(hasPin()&&!unlocked&&+sessionStorage.getItem('unl')>ts()){unlocked=true;sessionStorage.removeItem('unl')}
 if(!hasPin())return pinView(true);
 if(!unlocked)return pinView(false);
 ME.role=='admin'?adminView():memberView();
 startNearby();restoreDraft();
}
document.addEventListener('visibilitychange',()=>{
 if(document.hidden)hiddenAt=ts();
 else if(U&&unlocked&&hiddenAt&&ts()-hiddenAt>CFG.pinLockSeconds*1000&&ts()>NOLOCK){unlocked=false;route()}
});

/* ---------- 6-digit PIN ---------- */
function pinView(setup){
 let first=null;const tk='tries_'+U.uid;
 R(`<div class=box><h1>${setup?'Create a 6-digit PIN':'Enter PIN'}</h1><p class=mu id=h>${setup?'This PIN unlocks the app on this phone.':'Hello '+esc(ME.name)}</p>
 <input id=pin class=pin type=password inputmode=numeric maxlength=6 autocomplete=off><p class=err id=pe></p>
 ${setup?'':'<button class="b ghost" id=fg>Forgot PIN? Sign in again</button>'}</div>`);
 const i=$('#pin');i.focus();
 i.oninput=async()=>{
  if(i.value.length<6)return;const v=i.value;i.value='';
  if(setup){
   if(!first){first=v;$('#h').textContent='Type the PIN again to confirm';return}
   if(first!==v){first=null;$('#h').textContent='Choose a 6-digit PIN';return $('#pe').textContent='PINs did not match. Start again.'}
   localStorage.setItem(K(),JSON.stringify({h:await hash(v,U.uid),v:ME.pinReset||0}));unlocked=true;sig='';route();
  }else{
   if(await hash(v,U.uid)===JSON.parse(localStorage.getItem(K())).h){localStorage.removeItem(tk);unlocked=true;sig='';route()}
   else{const t=(+localStorage.getItem(tk)||0)+1;localStorage.setItem(tk,t);
    if(t>=5){localStorage.removeItem(tk);localStorage.removeItem(K());return auth.signOut()}
    $('#pe').textContent='Wrong PIN. '+(5-t)+' tries left.'}
  }};
 if($('#fg'))$('#fg').onclick=()=>{localStorage.removeItem(K());auth.signOut()};
}

/* ---------- shared header ---------- */
const ICO={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20c0-2.6-1.4-4.5-3.5-5.4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>',cart:'<path d="M4 5h2l2.2 10.5a1 1 0 0 0 1 .8h8.3a1 1 0 0 0 1-.8L20 8H7"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/>'};
const ic=k=>`<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICO[k]}</svg>`;
let NAVK='home';
const NAV={home:['Home','home'],users:['Users','user'],prod:['Products','box'],cust:['Customers','users'],ord:['Orders','cart'],cash:['Cash','cash'],rank:['Ranking','chart'],load:['Load list','list'],rep:['Reports','chart'],plan:['Plan','list']};
const NPERM={prod:'viewProducts',cust:'manageCustomers',ord:'createOrders',cash:'dayClosing',rank:'viewRanking',load:'loadList',rep:'viewReports',plan:'skillPlan'};
function navItems(){const adm=ME.role=='admin',p=ME.perms||{},L=(adm?CFG.navAdmin:CFG.navMember)||[];
 return L.filter(k=>NAV[k]&&(adm?!['rank','load','rep','plan'].includes(k):k!='users'&&(k=='home'||p[NPERM[k]]))).map(k=>[k,k=='cash'&&!adm?'Closing':NAV[k][0],NAV[k][1]])}
const navSel=(id,v)=>`<select id=${id}><option value="">(empty)</option>${Object.keys(NAV).map(k=>`<option value=${k} ${k==v?'selected':''}>${NAV[k][0]}</option>`).join('')}</select>`;
function applyFont(){const sys=ME&&ME.role!='admin'&&localStorage.getItem('sysfont')=='1',f=sys?FONTS[0]:(FONTS.find(x=>x.id==(CFG.font||1))||FONTS[0]);let l=$('#gf');
 if(f.gf){if(!l){l=document.createElement('link');l.id='gf';l.rel='stylesheet';document.head.appendChild(l)}const u='https://fonts.googleapis.com/css2?'+f.gf+'&display=swap';if(l.getAttribute('href')!=u)l.setAttribute('href',u)}else if(l)l.remove();
 document.body.style.fontFamily=f.css+',system-ui,sans-serif';if(!sys)try{localStorage.setItem('font',f.id)}catch(e){}}
function header(){const adm=ME.role=='admin',cur=adm?tab:NAVK;return `<div class=top><b>${esc(APP.name)}</b><small>v${APP.version}</small><span class=sp></span><span id=sy></span>${adm?'<button data-nav=set>Settings</button>':''}<button onclick="unlocked=false;sig='';route()">Lock</button><button onclick="auth.signOut()">Sign out</button></div><nav id=nav>${navItems().map(([k,l,i])=>`<button data-nav=${k} class="${cur==k?'on':''}">${ic(i)}<span>${l}</span></button>`).join('')}</nav>`}
function navGo(k){if(ME.role=='admin'){tab=k;return adminView()}({home:()=>{sig='';route()},cust:memberCust,ord:memberOrders,cash:memberClose,prod:memberProducts,rank:memberRank,load:memberLoad,rep:memberReports,plan:memberPlan})[k]()}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){const o=$('#ov');o&&o.remove();OV=null;navGo(n.dataset.nav)}});
function syncDot(){const e=$('#sy');if(e)e.innerHTML=`<span class="dot ${navigator.onLine?'':'off'}"></span> ${navigator.onLine?'Online':'Offline'}`}
addEventListener('online',syncDot);addEventListener('offline',syncDot);

/* ---------- member home ---------- */
function memberView(){NAVK='home';
 const on=Object.keys(PERMS).filter(k=>ME.perms&&ME.perms[k]);
 R(header()+`<div class=wrap><h2>Hello ${esc(ME.name)}</h2><p class=mu>Branch: ${esc(ME.branch||'not set')}</p><div id=ann></div><div id=tg></div>
 ${on.length?`<div class=grid>${on.map(k=>k=='viewProducts'?`<div class=tile onclick="memberProducts()" style="cursor:pointer;border-color:var(--pr)"><b>Products</b><div class=mu>Search, scan, prices</div></div>`:k=='manageCustomers'?`<div class=tile onclick="memberCust()" style="cursor:pointer;border-color:var(--pr)"><b>Customers</b><div class=mu>Today's visits, search, reminders</div></div>`:k=='createOrders'?`<div class=tile onclick="memberOrders()" style="cursor:pointer;border-color:var(--pr)"><b>Orders</b><div class=mu>New order, history</div></div>`:k=='dayClosing'?`<div class=tile onclick="memberClose()" style="cursor:pointer;border-color:var(--pr)"><b>Day closing</b><div class=mu>Cash, expenses, money counter</div></div>`:k=='loadList'?`<div class=tile onclick="memberLoad()" style="cursor:pointer;border-color:var(--pr)"><b>Load list</b><div class=mu>Tomorrow's vehicle load</div></div>`:k=='skillPlan'?`<div class=tile onclick="memberPlan()" style="cursor:pointer;border-color:var(--pr)"><b>30-day plan</b><div class=mu>Daily tasks, quiz, your numbers</div></div>`:k=='viewRanking'?`<div class=tile onclick="memberRank()" style="cursor:pointer;border-color:var(--pr)"><b>Customer ranking</b><div class=mu>Best to worst, with history</div></div>`:k=='viewReports'?`<div class=tile onclick="memberReports()" style="cursor:pointer;border-color:var(--pr)"><b>My reports</b><div class=mu>Sales, returns, top customers</div></div>`:['visitPlan','collectPayments','makeReturns','moneyCounter','editRate','addProducts','cancelSent'].includes(k)?'':`<div class=tile>${PERMS[k]}<div class=mu>Coming in a later phase</div></div>`).join('')}</div>`
 :'<div class=card>No features are switched on for you yet. Ask the admin to give access.</div>'}<label class=perm style="margin-top:14px"><input type=checkbox id=sysf ${localStorage.getItem('sysfont')=='1'?'checked':''}>Use my phone's default font</label></div>`);
 syncDot();loadCash();tgDraw();annDraw();$('#sysf').onchange=e=>{localStorage.setItem('sysfont',e.target.checked?'1':'0');applyFont()};
}

/* ---------- admin panel ---------- */
function adminView(){
 R(header()+`<div class=wrap><div id=ann></div><div class="tabs atabs"><button id=t1>Users</button><button id=t3>Products</button><button id=t4>Customers</button><button id=t5>Orders</button><button id=t6>Cash</button><button id=t2>Settings</button></div><div id=tb></div></div>`);
 syncDot();annDraw();$('#t1').onclick=()=>{tab='users';adminView()};$('#t2').onclick=()=>{tab='set';adminView()};$('#t3').onclick=()=>{tab='prod';adminView()};$('#t4').onclick=()=>{tab='cust';adminView()};$('#t5').onclick=()=>{tab='ord';adminView()};$('#t6').onclick=()=>{tab='cash';adminView()};
 {const tb=$('#t'+({users:1,set:2,prod:3,cust:4,ord:5,cash:6}[tab]));tb&&(tb.className='on')}
 if(tab=='home')homeView($('#tb'));else if(tab=='users'){
  $('#tb').innerHTML=`<select id=f>${['pending','approved','rejected','disabled','all'].map(x=>`<option ${x==filter?'selected':''} value=${x}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select><div id=ul></div>`;
  $('#f').onchange=e=>{filter=e.target.value;drawUsers()};
  unsubs.push(db.collection('users').orderBy('createdAt','desc').onSnapshot(s=>{USERS=s.docs.map(d=>({id:d.id,...d.data()}));drawUsers()}));
 }else if(tab=='prod')productsView($('#tb'));else if(tab=='cust')customersView($('#tb'));else if(tab=='ord')ordersHome($('#tb'));else if(tab=='cash')cashAdmin($('#tb'));else settingsView();
}
function drawUsers(){
 const ul=$('#ul');if(!ul)return;
 const L=USERS.filter(u=>filter=='all'||u.status==filter);
 ul.innerHTML=L.length?L.map(u=>{const me=u.id==U.uid;return `<div class=card>
  <div class=row><h2 style="flex:1">${esc(u.name)}</h2><span class="tag ${u.status}">${u.status}</span>${u.role=='admin'?'<span class="tag admin">admin</span>':''}</div>
  <div class=mu>${esc(u.email)}</div>
  <input placeholder="Branch (e.g. Riyadh, Jeddah)" value="${esc(u.branch)}" data-id=${u.id} data-act=branch><input type=number placeholder="Monthly sales target (with VAT)" value="${u.target||''}" data-id=${u.id} data-act=target>
  ${me?'':`<div>${u.status!='approved'?`<button class="b s grn" data-id=${u.id} data-act=approved>Approve</button>`:''}
  ${u.status=='pending'?`<button class="b s red" data-id=${u.id} data-act=rejected>Reject</button>`:''}
  ${u.status=='approved'?`<button class="b s red" data-id=${u.id} data-act=disabled>Disable</button>`:''}
  <button class="b s ghost" data-id=${u.id} data-act=pin>Reset PIN</button><button class="b s ghost" data-id=${u.id} data-act=logout>Force logout</button>
  <button class="b s ghost" data-id=${u.id} data-act=role>${u.role=='admin'?'Make member':'Make admin'}</button></div>
  <details><summary>Permissions (all off by default)</summary>${Object.entries(PERMS).map(([k,l])=>`<label class=perm><input type=checkbox data-id=${u.id} data-act=perm data-k=${k} ${u.perms&&u.perms[k]?'checked':''}>${l}</label>`).join('')}</details>`}</div>`}).join('')
  :'<div class=card>No users here.</div>';
}
document.addEventListener('click',async e=>{
 const a=e.target.dataset&&e.target.dataset.act,id=e.target.dataset&&e.target.dataset.id;if(!a||!id||a=='perm'||a=='branch')return;
 const r=db.doc('users/'+id);
 if(a=='approved'||a=='rejected'||a=='disabled')await r.update({status:a});logAct('User '+a,(USERS.find(x=>x.id==id)||{}).name);
 if(a=='pin'&&confirm('Reset this member PIN? They must set a new one.'))await r.update({pinReset:ts()});logAct('PIN reset',(USERS.find(x=>x.id==id)||{}).name);
 if(a=='logout'&&confirm('Force this member to sign in again?'))await r.update({forceLogoutAt:ts()});logAct('Force logout',(USERS.find(x=>x.id==id)||{}).name);
 if(a=='role'&&confirm('Change role?')){const u=USERS.find(x=>x.id==id);await r.update({role:u.role=='admin'?'member':'admin'});logAct('Role changed',u.name+' now '+(u.role=='admin'?'member':'admin'))}
});
document.addEventListener('change',async e=>{
 const d=e.target.dataset;if(!d||!d.id)return;
 if(d.act=='perm')await db.doc('users/'+d.id).update({['perms.'+d.k]:e.target.checked});
 if(d.act=='target')await db.doc('users/'+d.id).update({target:+e.target.value||0});
 if(d.act=='branch')await db.doc('users/'+d.id).update({branch:e.target.value.trim()});
});
function settingsView(){
 $('#tb').innerHTML=`<div class=card><h2>Settings (admin only)</h2>${Object.entries(SETTING_LABELS).map(([k,l])=>`<label class=mu>${l}</label><input type=number id=s_${k} value="${CFG[k]}">`).join('')}
 <label class=mu>Font (for everyone)</label><select id=s_font onchange="CFG.font=+this.value;applyFont()">${FONTS.map(f=>`<option value=${f.id} ${f.id==(CFG.font||1)?'selected':''}>${f.id}. ${f.name}</option>`).join('')}</select>
 <label class=mu>Admin bottom bar (6 buttons, in order)</label>${[0,1,2,3,4,5].map(i=>navSel('na'+i,(CFG.navAdmin||[])[i])).join('')}
 <label class=mu>Member bottom bar (members only see what their permissions allow)</label>${[0,1,2,3,4,5].map(i=>navSel('nm'+i,(CFG.navMember||[])[i])).join('')}
 <label class=mu>30-day plan tasks (one line per day, tasks separated by |). Members' progress stays private.</label><textarea id=s_plan rows=10 style="width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit">${esc(planLines().join('\n'))}</textarea>
 <label class=mu>Announcement (shown on every member's home screen, leave empty to hide)</label><textarea id=s_ann rows=3 style="width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit">${esc(CFG.announcement||'')}</textarea><button class=b id=sv>Save settings</button><p class=mu id=sm></p></div>
 <div class=card><h2>About</h2><p class=mu>${esc(APP.name)} · version ${APP.version} · ${APP.date}</p></div>`;
 $('#sv').onclick=async()=>{const o={};for(const k in SETTING_LABELS)o[k]=+$('#s_'+k).value;o.announcement=$('#s_ann').value.trim();o.plan=$('#s_plan').value.split('\n').map(x=>x.trim()).filter(Boolean);o.font=+$('#s_font').value;const nv=p=>[...new Set([0,1,2,3,4,5].map(i=>$('#'+p+i).value).filter(Boolean))];o.navAdmin=nv('na');o.navMember=nv('nm');await db.doc('settings/app').set(o,{merge:true});Object.assign(CFG,o);applyFont();alert('Saved.');adminView()};
}

applyFont();
/* ---------- service worker + auto reload on new version ---------- */
if('serviceWorker' in navigator){
 const had=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.register('sw.js');
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload()});
}
</script></body></html>
